services:
  music-api:
    image: ghcr.io/${IMAGE_OWNER:-raymondsugiarto}/music-api:latest
    environment: &backend-environment
      CONFIG_PATH: /config/resources
      SERVER_REST_ENV: production
      SERVER_REST_HOST: 0.0.0.0
      SERVER_REST_PORT: 8080
      DATABASE_MAIN_HOST: postgres
      DATABASE_MAIN_PORT: 5432
      DATABASE_MAIN_USER: ${DATABASE_MAIN_USER:-music}
      DATABASE_MAIN_PASSWORD: ${DATABASE_MAIN_PASSWORD:?Set DATABASE_MAIN_PASSWORD in the Portainer stack}
      DATABASE_MAIN_NAME: music
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the Portainer stack}
      SECURITY_MASTERKEY: ${SECURITY_MASTERKEY:?Set SECURITY_MASTERKEY in the Portainer stack}
      SECURITY_IPHASHSALT: ${SECURITY_IPHASHSALT:?Set SECURITY_IPHASHSALT in the Portainer stack}
      SECURITY_COOKIESECURE: "true"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCALROOT: /data/storage
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESSKEYID: ${STORAGE_S3_ACCESSKEYID:-}
      STORAGE_S3_SECRETACCESSKEY: ${STORAGE_S3_SECRETACCESSKEY:-}
      STORAGE_S3_USEPATHSTYLE: ${STORAGE_S3_USEPATHSTYLE:-false}
      STORAGE_S3_PREFIX: ${STORAGE_S3_PREFIX:-}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in the Portainer stack}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_BREVO_APIKEY: ${MAIL_BREVO_APIKEY:-}
      MAIL_BREVO_SENDEREMAIL: ${MAIL_BREVO_SENDEREMAIL:-}
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-false}
      NOTIFICATION_ATTACHFULLAUDIO: ${NOTIFICATION_ATTACHFULLAUDIO:-false}
      NOTIFICATION_MAXATTACHMENTMB: ${NOTIFICATION_MAXATTACHMENTMB:-3}
      NOTIFICATION_SITEURL: ${NOTIFICATION_SITEURL:-}
      PAYMENT_UNLOCKPRICE: ${PAYMENT_UNLOCKPRICE:-49000}
      PAYMENT_ORDERTTL: ${PAYMENT_ORDERTTL:-60m}
      PAYMENT_PUBLICBASEURL: ${PAYMENT_PUBLICBASEURL:?Set PAYMENT_PUBLICBASEURL to the frontend URL}
      PAYMENT_DOKU_BASEURL: ${PAYMENT_DOKU_BASEURL:-https://api.doku.com}
      PAYMENT_DOKU_CLIENTID: ${PAYMENT_DOKU_CLIENTID:-}
      PAYMENT_DOKU_SECRETKEY: ${PAYMENT_DOKU_SECRETKEY:-}
      PAYMENT_DOKU_NOTIFYPATH: ${PAYMENT_DOKU_NOTIFYPATH:-/api/v1/payments/doku/notifications}
    volumes:
      - song-storage:/data/storage
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
      - platform

  worker:
    image: ghcr.io/${IMAGE_OWNER:-raymondsugiarto}/music-api:latest
    command: ["worker"]
    environment: *backend-environment
    volumes:
      - song-storage:/data/storage
    depends_on:
      music-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  song-storage:

networks:
  platform:
    external: true
