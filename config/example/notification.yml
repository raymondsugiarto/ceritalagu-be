# "Your song is ready" email, sent by the worker right after a song is generated.
# The attached file is the 60 s preview, or the full song when attachFullAudio is on.
notification:
  enabled: false              # NOTIFICATION_ENABLED
  attachFullAudio: false      # NOTIFICATION_ATTACHFULLAUDIO
  maxAttachmentMB: 3          # NOTIFICATION_MAXATTACHMENTMB (raw bytes; the base64 payload is ~33% larger)
  siteUrl:                    # NOTIFICATION_SITEURL (link to the song page in the email)
  # "Payment succeeded" email, sent by the API once an order is paid (only once per order).
  # brevoTemplateId: id of the template pasted from docs/email-templates/payment-success.html.
  # 0 sends a plain built-in email (also what the log driver prints).
  paymentReceipt:
    enabled: false            # NOTIFICATION_PAYMENTRECEIPT_ENABLED
    brevoTemplateId: 0        # NOTIFICATION_PAYMENTRECEIPT_BREVOTEMPLATEID
    attachFullAudio: false    # NOTIFICATION_PAYMENTRECEIPT_ATTACHFULLAUDIO (needs maxAttachmentMB room)
