# Song generation pipeline + worker (server worker).
generation:
  queue: generation
  concurrency: 4
  taskTimeout: 15m
  taskMaxRetry: 3
  previewSeconds: 60
  fadeSeconds: 3
  guestRetention: 720h # 30 days
  retryBaseDelay: 2s
  ffmpegPath:
  guestDailyQuota: 10
  maxRegenerate: 2
  spareReveal: 90s # "Buat Ulang" from the spare Suno take: fake loading time before the song shows
