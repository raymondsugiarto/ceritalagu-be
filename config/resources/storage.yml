# Audio storage. local = files on disk (development). s3 = private S3-compatible bucket (AWS S3, R2, MinIO).
# Layout: users/<user_id>/songs/<song_id>/{full,preview}.mp3, guests/<guest_session_id>/songs/...,
# playground/<id>.<format> (admin playground; shown on the landing page when featured).
# Secrets only from env: STORAGE_S3_ACCESSKEYID, STORAGE_S3_SECRETACCESSKEY.
storage:
  driver: s3 # local | s3   (env STORAGE_DRIVER)
  localRoot: tmp/storage
  s3:
    bucket: ceritalagu # STORAGE_S3_BUCKET
    region: ap-southeast-1 # STORAGE_S3_REGION (auto for Cloudflare R2)
    endpoint: # STORAGE_S3_ENDPOINT (empty for AWS)
    accessKeyId: # env STORAGE_S3_ACCESSKEYID
    secretAccessKey: # env STORAGE_S3_SECRETACCESSKEY
    usePathStyle: false
    prefix:
